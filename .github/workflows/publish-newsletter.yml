name: Publish newsletter

# Trigger 1 (push): someone drops a raw Braze export directly into a path like
#   raw-newsletters/<brand>/<variant>/<YYYY-MM-DD>.html
# e.g. raw-newsletters/aurora/coupon/2026-07-07.html
#      raw-newsletters/youbravo/standard/2026-07-07.html
#
# Trigger 2 (workflow_dispatch): "Normalize incoming Braze export" calls this
# with the paths it just moved. Can also be run by hand from the Actions tab
# to republish specific files.
on:
  push:
    branches: [main]
    paths:
      - "raw-newsletters/*/*/*.html"
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated raw files, e.g. raw-newsletters/aurora/coupon/2026-07-07.html"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the previous commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Determine files to publish
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PATHS: ${{ inputs.paths }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          : > files.txt
          if [ "$EVENT" = "workflow_dispatch" ]; then
            for p in $INPUT_PATHS; do
              # Only accept paths in the expected shape (also blocks anything odd
              # typed into the manual "Run workflow" form).
              if [[ ! "$p" =~ ^raw-newsletters/[a-z0-9_-]+/[a-z0-9_-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?\.html$ ]]; then
                echo "::error::Ignoring '$p' -- not a raw-newsletters/<brand>/<variant>/<date>.html path"
                continue
              fi
              if [ ! -f "$p" ]; then
                echo "::error::Ignoring '$p' -- file not found on main"
                continue
              fi
              echo "$p" >> files.txt
            done
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$SHA~1"
            fi
            git diff --name-only --diff-filter=AMR "$BEFORE" "$SHA" -- 'raw-newsletters/*/*/*.html' \
              | grep -v '^raw-newsletters/incoming/' > files.txt || true
          fi
          echo "Files to publish:"
          cat files.txt

      - name: Clean each newsletter and sync to Webflow
        shell: bash
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # f looks like: raw-newsletters/aurora/coupon/2026-07-07.html
            rel="${f#raw-newsletters/}"          # aurora/coupon/2026-07-07.html
            brand=$(echo "$rel" | cut -d/ -f1)   # aurora
            variant=$(echo "$rel" | cut -d/ -f2) # coupon
            date=$(basename "$rel" .html)        # 2026-07-07

            out_dir="docs/newsletters/${brand}/${variant}"
            mkdir -p "$out_dir"

            # clean_newsletter.py prints each file it wrote, one per line, to stdout.
            # A failure here (bad HTML, unexpected structure, etc.) shouldn't take
            # down the rest of the batch -- log it and move to the next file.
            if ! written_files=$(python scripts/clean_newsletter.py "$f" "${out_dir}/${date}" < /dev/null); then
              echo "::error file=$f::Cleaning failed -- skipping this file, rest of batch continues"
              continue
            fi

            for cleaned_path in $written_files; do
              # cleaned_path looks like docs/newsletters/aurora/coupon/2026-07-07-it.html
              # or docs/newsletters/aurora/coupon/2026-07-07.html if no locale split
              stem=$(basename "$cleaned_path" .html)
              if [[ "$stem" == "${date}-"* ]]; then
                locale="${stem#${date}-}"
              else
                locale="default"
              fi
              hosted_path="${cleaned_path#docs/}"

              noindex_flag=""
              if [ "$variant" = "coupon" ]; then
                noindex_flag="--noindex"
              fi

              # Same principle here: if the Webflow sync fails for this one item
              # (API hiccup, bad slug, whatever), log it and keep going -- the
              # cleaned file still gets committed below either way, so a retry
              # later just needs to re-run the sync, not redo everything.
              if ! python scripts/sync_webflow.py \
                --brand "$brand" \
                --variant "$variant" \
                --locale "$locale" \
                --date "$date" \
                --hosted-path "$hosted_path" \
                $noindex_flag < /dev/null; then
                echo "::error file=$f::Webflow sync failed for $cleaned_path -- file is cleaned and will still be committed/published, but has no CMS item yet. Re-run sync_webflow.py for this one manually or retry."
              fi
            done
          done < files.txt

      - name: Commit cleaned files to docs/ (GitHub Pages source)
        shell: bash
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/newsletters
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Publish cleaned newsletter(s)"

          # Retry in case another run pushed in the meantime.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "::error::Could not push cleaned files after 5 attempts"
          exit 1

# Setup checklist (one-time):
#   1. Enable GitHub Pages on this repo, source = /docs on main.
#   2. Add repo secrets: WEBFLOW_TOKEN, WEBFLOW_COLLECTION_ID.
#   3. Add repo variable: PAGES_BASE_URL (your Pages URL, no trailing slash).
#   4. In Webflow, create the Newsletters collection with fields:
#      Brand (Option: Aurora/Youbravo), Variant (Plain text), Locale (Plain text),
#      Send date (Date), Hosted HTML URL (Link), Summary (Plain text).
#   5. Drop a raw Braze export into raw-newsletters/<brand>/<variant>/<date>.html
#      and push to main -- or into raw-newsletters/incoming/ with its Braze name.
